<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сербский для магазина, пекарни и ресторана</title>

  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1d2939;
      --muted: #667085;
      --primary: #3157c8;
      --primary-hover: #2547aa;
      --correct: #16794b;
      --correct-bg: #e8f8ef;
      --wrong: #c83c3c;
      --wrong-bg: #fff0f0;
      --border: #d9e0ea;
      --shadow: 0 12px 35px rgba(37, 57, 96, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 16px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #dce8ff 0, transparent 35%),
        radial-gradient(circle at bottom right, #e5f8ed 0, transparent 32%),
        var(--bg);
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 22px;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 10px;
      color: #182b61;
      font-size: clamp(26px, 5vw, 38px);
    }

    .header p {
      margin: 0;
      line-height: 1.5;
      color: var(--muted);
    }

    .card {
      padding: clamp(20px, 5vw, 38px);
      background: var(--card);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .settings {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding-bottom: 20px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }

    .settings label {
      font-size: 14px;
      font-weight: bold;
    }

    select,
    .text-answer {
      padding: 11px 12px;
      font-size: 16px;
      color: var(--text);
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    select {
      cursor: pointer;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 14px;
      color: var(--muted);
    }

    .progress-bar {
      height: 9px;
      margin-bottom: 28px;
      overflow: hidden;
      background: #e8edf5;
      border-radius: 99px;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #3157c8, #5a80ef);
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    .category {
      display: inline-block;
      padding: 7px 11px;
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: bold;
      color: var(--primary);
      background: #eaf0ff;
      border-radius: 999px;
    }

    .question-label {
      margin-bottom: 7px;
      font-size: 15px;
      color: var(--muted);
    }

    .question {
      margin: 0 0 28px;
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.25;
    }

    .answers {
      display: grid;
      gap: 12px;
    }

    .answer-btn {
      width: 100%;
      padding: 16px 18px;
      font-size: 17px;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      background: white;
      border: 2px solid var(--border);
      border-radius: 13px;
      transition: 0.2s ease;
    }

    .answer-btn:hover:not(:disabled) {
      background: #f5f8ff;
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .answer-btn:disabled {
      cursor: default;
    }

    .answer-btn.correct {
      font-weight: bold;
      color: #0e6139;
      background: var(--correct-bg);
      border-color: var(--correct);
    }

    .answer-btn.wrong {
      color: #a82c2c;
      background: var(--wrong-bg);
      border-color: var(--wrong);
    }

    .input-area {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    .text-answer {
      width: 100%;
      min-width: 0;
      border: 2px solid var(--border);
      outline: none;
    }

    .text-answer:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(49, 87, 200, 0.12);
    }

    .text-answer.correct-input {
      color: #0e6139;
      background: var(--correct-bg);
      border-color: var(--correct);
    }

    .text-answer.wrong-input {
      color: #a82c2c;
      background: var(--wrong-bg);
      border-color: var(--wrong);
    }

    .feedback {
      display: none;
      padding: 15px 16px;
      margin-top: 20px;
      line-height: 1.5;
      border-radius: 12px;
    }

    .feedback.show {
      display: block;
    }

    .feedback.good {
      color: #135f39;
      background: var(--correct-bg);
      border: 1px solid #b9e8cb;
    }

    .feedback.bad {
      color: #9b2727;
      background: var(--wrong-bg);
      border: 1px solid #f4c5c5;
    }

    .hint {
      display: block;
      margin-top: 7px;
      font-size: 14px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .main-btn {
      padding: 13px 20px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      background: var(--primary);
      border: 0;
      border-radius: 11px;
      transition: 0.2s ease;
    }

    .main-btn:hover {
      background: var(--primary-hover);
    }

    .main-btn:disabled {
      cursor: default;
      opacity: 0.65;
    }

    #nextBtn {
      display: none;
    }

    .result {
      display: none;
      text-align: center;
    }

    .result h2 {
      margin: 0 0 12px;
      font-size: 30px;
      color: #182b61;
    }

    .result-score {
      margin: 14px 0;
      font-size: 54px;
      font-weight: bold;
      color: var(--primary);
    }

    .result p {
      line-height: 1.55;
      color: var(--muted);
    }

    .mistakes {
      display: none;
      margin-top: 26px;
      padding-top: 20px;
      text-align: left;
      border-top: 1px solid var(--border);
    }

    .mistake-item {
      padding: 12px 14px;
      margin-bottom: 10px;
      line-height: 1.45;
      background: #fff8ed;
      border-left: 4px solid #e49a27;
      border-radius: 8px;
    }

    .footer-note {
      margin-top: 18px;
      font-size: 13px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      .input-area {
        flex-direction: column;
      }

      .input-area .main-btn {
        width: 100%;
      }

      .settings select {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="header">
      <h1>🇷🇸 Сербский в магазине и ресторане</h1>
      <p>
        100 разговорных фраз. В каждом запуске — случайные 20 вопросов.
      </p>
    </header>

    <section class="card">
      <div id="quizScreen">
        <div class="settings">
          <label for="categorySelect">Тема:</label>

          <select id="categorySelect">
            <option value="all">Все темы</option>
            <option value="Магазин">Магазин</option>
            <option value="Пекарня">Пекарня</option>
            <option value="Ресторан">Ресторан / кафе</option>
          </select>

          <button class="main-btn" onclick="startQuiz()">Начать заново</button>
        </div>

        <div class="progress-row">
          <span id="progressText">Вопрос 1 из 20</span>
          <span id="scoreText">Верно: 0</span>
        </div>

        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <span class="category" id="category"></span>

        <div class="question-label" id="questionLabel"></div>

        <h2 class="question" id="question"></h2>

        <div class="answers" id="answers"></div>

        <div class="feedback" id="feedback"></div>

        <div class="actions">
          <button class="main-btn" id="nextBtn" onclick="nextQuestion()">
            Следующий вопрос →
          </button>
        </div>
      </div>

      <div class="result" id="resultScreen">
        <h2>Квиз завершён!</h2>
        <div class="result-score" id="finalScore">0 / 20</div>
        <p id="resultMessage"></p>

        <button class="main-btn" onclick="startQuiz()">Пройти ещё раз</button>

        <div class="mistakes" id="mistakesBlock">
          <h3>Фразы для повторения</h3>
          <div id="mistakesList"></div>
        </div>
      </div>
    </section>

    <p class="footer-note">
      Можно вводить ответы без специальных букв: например, <b>kafa</b> вместо <b>kafa</b>,
      <b>racun</b> вместо <b>račun</b>, <b>cevapa</b> вместо <b>ćevapa</b>.
    </p>
  </main>

      },
      {

        ru: "Как ответить на вопрос о времени: «Около восьми»?",

      {

        t: "choice",
        ru: "Как спросить: «Есть места сегодня вечером?»",
        a: "Ima li mesta večeras?",
        alts: ["Je l' ima mesta večeras?"]

    let quizQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let mistakes = [];
    let answered = false;

    const categorySelect = document.getElementById("categorySelect");
    const questionEl = document.getElementById("question");
    const questionLabel = document.getElementById("questionLabel");
    const categoryEl = document.getElementById("category");
    const answersEl = document.getElementById("answers");
    const feedbackEl = document.getElementById("feedback");
    const nextBtn = document.getElementById("nextBtn");
    const progressText = document.getElementById("progressText");
    const scoreText = document.getElementById("scoreText");
    const progressFill = document.getElementById("progressFill");
    const quizScreen = document.getElementById("quizScreen");
    const resultScreen = document.getElementById("resultScreen");

    function shuffle(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    function normalizeAnswer(text) {
      return text
        .toLowerCase()
        .trim()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/g, "dj")
        .replace(/[’'.,!?;:()"„“]/g, "")
        .replace(/\bje\s+l\b/g, "jel")
        .replace(/\bda\s+l\b/g, "dal")
        .replace(/\s+/g, " ");
    }

    function isCorrectAnswer(userAnswer, item) {
      const answers = [item.a, ...(item.alts || [])]
        .map(normalizeAnswer);

      return answers.includes(normalizeAnswer(userAnswer));
    }

    function startQuiz() {
      const selectedCategory = categorySelect.value;

      const source = selectedCategory === "all"
        ? ALL_QUESTIONS
        : ALL_QUESTIONS.filter(item => item.c === selectedCategory);

      quizQuestions = shuffle(source).slice(0, 20);

      currentIndex = 0;
      score = 0;
      mistakes = [];
      answered = false;

      quizScreen.style.display = "block";
      resultScreen.style.display = "none";

      renderQuestion();
    }

    function renderQuestion() {
      answered = false;

      const item = quizQuestions[currentIndex];

      categoryEl.textContent = item.c;
      questionEl.textContent = item.ru;
      answersEl.innerHTML = "";

      questionLabel.textContent = item.t === "input"
        ? "Напишите естественный вариант по-сербски:"
        : "Выберите естественный вариант:";

      feedbackEl.className = "feedback";
      feedbackEl.innerHTML = "";
      nextBtn.style.display = "none";

      progressText.textContent =
        `Вопрос ${currentIndex + 1} из ${quizQuestions.length}`;

      scoreText.textContent = `Верно: ${score}`;

      progressFill.style.width =
        `${(currentIndex / quizQuestions.length) * 100}%`;

      if (item.t === "input") {
        renderInputQuestion();
      } else {
        renderChoiceQuestion(item);
      }
    }

    function renderChoiceQuestion(item) {
      const sameCategoryQuestions = ALL_QUESTIONS.filter(question =>
        question.c === item.c && question.a !== item.a
      );

      const wrongAnswers = shuffle(sameCategoryQuestions)
        .slice(0, 3)
        .map(question => question.a);

      const options = shuffle([item.a, ...wrongAnswers]);

      options.forEach(option => {
        const button = document.createElement("button");

        button.className = "answer-btn";
        button.textContent = option;

        button.addEventListener("click", () => {
          checkChoiceAnswer(option, button);
        });

        answersEl.appendChild(button);
      });
    }

    function renderInputQuestion() {
      const inputArea = document.createElement("div");
      inputArea.className = "input-area";

      const input = document.createElement("input");
      input.type = "text";
      input.id = "textAnswer";
      input.className = "text-answer";
      input.placeholder = "Введите фразу на сербском...";
      input.autocomplete = "off";

      const checkButton = document.createElement("button");
      checkButton.className = "main-btn";
      checkButton.textContent = "Проверить";

      checkButton.addEventListener("click", () => {
        checkInputAnswer(input);
      });

      input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          checkInputAnswer(input);
        }
      });

      inputArea.appendChild(input);
      inputArea.appendChild(checkButton);
      answersEl.appendChild(inputArea);

      setTimeout(() => input.focus(), 100);
    }

    function checkChoiceAnswer(selected, selectedButton) {
      if (answered) return;

      answered = true;

      const item = quizQuestions[currentIndex];
      const allButtons = document.querySelectorAll(".answer-btn");
      const isCorrect = selected === item.a;

      allButtons.forEach(button => {
        button.disabled = true;

        if (button.textContent === item.a) {
          button.classList.add("correct");
        }
      });

      if (!isCorrect) {
        selectedButton.classList.add("wrong");
      }

      finishAnswer(isCorrect, item);
    }

    function checkInputAnswer(input) {
      if (answered) return;

      const userAnswer = input.value.trim();

      if (!userAnswer) {
        input.focus();
        input.placeholder = "Сначала введите ответ";
        return;
      }

      answered = true;

      const item = quizQuestions[currentIndex];
      const isCorrect = isCorrectAnswer(userAnswer, item);

      input.disabled = true;
      input.classList.add(isCorrect ? "correct-input" : "wrong-input");

      const checkButton = document.querySelector(".input-area .main-btn");

      if (checkButton) {
        checkButton.disabled = true;
      }

      finishAnswer(isCorrect, item);
    }

    function finishAnswer(isCorrect, item) {
      if (isCorrect) {
        score++;

        feedbackEl.className = "feedback show good";
        feedbackEl.innerHTML = `
          <strong>Верно!</strong>
          <span class="hint">
            Так действительно можно сказать в обычной ситуации.
          </span>
        `;
      } else {
        mistakes.push(item);

        feedbackEl.className = "feedback show bad";
        feedbackEl.innerHTML = `
          <strong>Не совсем.</strong>
          Естественный вариант: <b>${item.a}</b>
        `;
      }

      scoreText.textContent = `Верно: ${score}`;

      nextBtn.style.display = "inline-block";

      nextBtn.textContent = currentIndex === quizQuestions.length - 1
        ? "Показать результат"
        : "Следующий вопрос →";
    }

    function nextQuestion() {
      currentIndex++;

      if (currentIndex < quizQuestions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      quizScreen.style.display = "none";
      resultScreen.style.display = "block";
      progressFill.style.width = "100%";

      const total = quizQuestions.length;
      const percent = Math.round((score / total) * 100);

      document.getElementById("finalScore").textContent =
        `${score} / ${total}`;

      let message = "";

      if (percent === 100) {
        message = "Отлично! Вы уверенно справитесь с заказами, покупками и разговором в кафе.";
      } else if (percent >= 75) {
        message = "Очень хороший результат. Повторите несколько фраз — и будет совсем уверенно.";
      } else if (percent >= 50) {
        message = "Неплохо. Перезапустите тест: в следующий раз попадутся другие 20 фраз.";
      } else {
        message = "Повторите фразы ниже и попробуйте ещё раз. Постепенно они начнут запоминаться автоматически.";
      }

      document.getElementById("resultMessage").textContent = message;

      const mistakesBlock = document.getElementById("mistakesBlock");
      const mistakesList = document.getElementById("mistakesList");

      mistakesList.innerHTML = "";

      if (mistakes.length > 0) {
        mistakesBlock.style.display = "block";

        mistakes.forEach(item => {
          const div = document.createElement("div");

          div.className = "mistake-item";
          div.innerHTML = `
            <b>${item.ru}</b><br>
            <span>${item.a}</span>
          `;

          mistakesList.appendChild(div);
        });
      } else {
        mistakesBlock.style.display = "none";
      }
    }

    startQuiz();
  </script>
