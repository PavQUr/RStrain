<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Сербский на каждый день</title>

  <style>
    :root {
      --bg: #f3f6fc;
      --surface: #ffffff;
      --surface-soft: #eef3ff;
      --text: #182230;
      --muted: #667085;
      --primary: #3157c8;
      --primary-dark: #2445a7;
      --primary-soft: #e7eeff;
      --border: #d9e1ef;
      --success: #117447;
      --success-bg: #e8f8ef;
      --danger: #b42318;
      --danger-bg: #fff0ef;
      --shadow: 0 8px 28px rgba(35, 56, 105, 0.10);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    button {
      touch-action: manipulation;
    }

    .app {
      width: 100%;
      max-width: 650px;
      min-height: 100dvh;
      margin: 0 auto;
      background:
        radial-gradient(circle at top left, #dce8ff 0, transparent 34%),
        radial-gradient(circle at bottom right, #e1f6e8 0, transparent 30%),
        var(--bg);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: max(16px, env(safe-area-inset-top)) 16px 12px;
      background: rgba(243, 246, 252, 0.92);
      backdrop-filter: blur(12px);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .title {
      margin: 0;
      font-size: 22px;
      line-height: 1.1;
      color: #16275d;
    }

    .subtitle {
      margin: 5px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .restart-btn {
      flex-shrink: 0;
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      color: var(--primary);
      cursor: pointer;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      min-height: 40px;
      padding: 9px 14px;
      color: var(--muted);
      white-space: nowrap;
      cursor: pointer;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 14px;
      font-weight: bold;
    }

    .filter-btn.active {
      color: white;
      background: var(--primary);
      border-color: var(--primary);
    }

    .quiz-screen,
    .result-screen {
      min-height: calc(100dvh - 145px);
      padding: 8px 16px calc(118px + env(safe-area-inset-bottom));
    }

    .result-screen {
      display: none;
    }

    .progress-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 8px 0 10px;
      font-size: 14px;
      color: var(--muted);
    }

    .progress-bar {
      height: 8px;
      overflow: hidden;
      background: #dfe6f1;
      border-radius: 999px;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #3157c8, #6389f3);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 6px 10px;
      margin: 26px 0 12px;
      color: var(--primary);
      background: var(--primary-soft);
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
    }

    .scenario-card {
      margin-bottom: 18px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .speaker {
      padding: 10px 15px;
      color: var(--muted);
      background: #f7f9fd;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: bold;
    }

    .serbian-line {
      padding: 18px 16px;
      font-size: clamp(22px, 6vw, 29px);
      font-weight: bold;
      line-height: 1.25;
      color: #172d6d;
    }

    .task-label {
      margin: 14px 0 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .task {
      margin: 0 0 22px;
      font-size: clamp(21px, 5.2vw, 28px);
      font-weight: bold;
      line-height: 1.3;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer-btn {
      width: 100%;
      min-height: 58px;
      padding: 14px 16px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 15px;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.3;
      transition: 0.18s ease;
    }

    .answer-btn:hover:not(:disabled),
    .answer-btn:active:not(:disabled) {
      background: #f4f7ff;
      border-color: var(--primary);
    }

    .answer-btn:disabled {
      cursor: default;
    }

    .answer-btn.correct {
      color: #0d5a35;
      background: var(--success-bg);
      border-color: var(--success);
    }

    .answer-btn.wrong {
      color: #9b1c14;
      background: var(--danger-bg);
      border-color: var(--danger);
    }

    .input-area {
      display: grid;
      gap: 10px;
    }

    .text-answer {
      width: 100%;
      min-height: 58px;
      padding: 14px 15px;
      color: var(--text);
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 15px;
      outline: none;
      font-size: 17px;
    }

    .text-answer:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(49, 87, 200, 0.13);
    }

    .text-answer.correct-input {
      color: #0d5a35;
      background: var(--success-bg);
      border-color: var(--success);
    }

    .text-answer.wrong-input {
      color: #9b1c14;
      background: var(--danger-bg);
      border-color: var(--danger);
    }

    .feedback {
      display: none;
      padding: 14px 15px;
      margin-top: 16px;
      border-radius: 14px;
      line-height: 1.45;
    }

    .feedback.show {
      display: block;
    }

    .feedback.good {
      color: #0d5a35;
      background: var(--success-bg);
      border: 1px solid #bde8ce;
    }

    .feedback.bad {
      color: #9b1c14;
      background: var(--danger-bg);
      border: 1px solid #f5c5c1;
    }

    .bottom-bar {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      padding: 12px 16px max(12px, env(safe-area-inset-bottom));
      background: rgba(243, 246, 252, 0.94);
      border-top: 1px solid rgba(217, 225, 239, 0.8);
      backdrop-filter: blur(12px);
    }

    .bottom-bar-inner {
      width: 100%;
      max-width: 618px;
    }

    .main-btn {
      width: 100%;
      min-height: 56px;
      padding: 13px 18px;
      color: white;
      cursor: pointer;
      background: var(--primary);
      border: 0;
      border-radius: 15px;
      font-size: 17px;
      font-weight: bold;
      transition: 0.2s ease;
    }

    .main-btn:hover {
      background: var(--primary-dark);
    }

    .main-btn:disabled {
      cursor: default;
      opacity: 0.75;
    }

    #nextBtn {
      display: none;
    }

    .result-card {
      margin-top: 26px;
      padding: 28px 20px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .result-card h2 {
      margin: 0 0 10px;
      color: #16275d;
      font-size: 29px;
    }

    .result-score {
      margin: 16px 0;
      color: var(--primary);
      font-size: 54px;
      font-weight: bold;
    }

    .result-card p {
      margin: 0;
      line-height: 1.5;
      color: var(--muted);
    }

    .result-actions {
      margin-top: 22px;
    }

    .mistakes {
      display: none;
      margin-top: 24px;
      text-align: left;
    }

    .mistakes h3 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .mistake-item {
      padding: 13px 14px;
      margin-bottom: 10px;
      line-height: 1.45;
      background: #fff9ed;
      border-left: 4px solid #e49a27;
      border-radius: 10px;
    }

    .mistake-answer {
      display: inline-block;
      margin-top: 5px;
      color: #6f4810;
      font-weight: bold;
    }

    @media (min-width: 700px) {
      body {
        padding: 20px;
      }

      .app {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .bottom-bar {
        right: auto;
        left: 50%;
        width: min(650px, 100%);
        transform: translateX(-50%);
        border-right: 1px solid rgba(217, 225, 239, 0.8);
        border-left: 1px solid rgba(217, 225, 239, 0.8);
      }
    }
  </style>
</head>

  <main class="app">

          </p>
        </div>

        <button class="restart-btn" id="restartBtn" title="Начать заново">
          ↻
        </button>
      </div>

      <div class="filters" id="filters">
        <button class="filter-btn active" data-category="all">Все</button>
        <button class="filter-btn" data-category="Магазин">Магазин</button>
        <button class="filter-btn" data-category="Пекарня">Пекарня</button>
        <button class="filter-btn" data-category="Ресторан">Кафе / ресторан</button>
        <button class="filter-btn" data-category="Документы">Документы</button>
      </div>
    </header>

    <section class="quiz-screen" id="quizScreen">
      <div class="progress-info">
        <span id="progressText">Вопрос 1 из 20</span>
        <span id="scoreText">Верно: 0</span>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <span class="category-badge" id="categoryBadge"></span>

      <div class="scenario-card" id="scenarioCard">
        <div class="speaker" id="speaker">Ситуация</div>
        <div class="serbian-line" id="serbianLine"></div>
      </div>

      <div class="task-label" id="taskLabel">Твоя задача</div>
      <h2 class="task" id="task"></h2>

      <div class="answers" id="answers"></div>

      <div class="feedback" id="feedback"></div>
    </section>

    <section class="result-screen" id="resultScreen">
      <div class="result-card">
        <h2>Квиз завершён</h2>
        <div class="result-score" id="finalScore">0 / 20</div>
        <p id="resultMessage"></p>

        <div class="result-actions">
          <button class="main-btn" id="restartResultBtn">
            Пройти другие 20 ситуаций
          </button>
        </div>

        <div class="mistakes" id="mistakesBlock">
          <h3>Повтори эти фразы</h3>
          <div id="mistakesList"></div>
        </div>
      </div>
    </section>
  </main>

  <div class="bottom-bar" id="bottomBar">
    <div class="bottom-bar-inner">
      <button class="main-btn" id="nextBtn">Следующий вопрос →</button>
    </div>
  </div>

    function shuffle(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    function normalizeAnswer(text) {
      return text
        .toLowerCase()
        .trim()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/g, "dj")
        .replace(/[’'.,!?;:()"„“]/g, "")
        .replace(/\bje\s+l\b/g, "jel")
        .replace(/\bda\s+l\b/g, "dal")
        .replace(/\s+/g, " ");
    }

    function isCorrectAnswer(userAnswer, item) {
      const validAnswers = [item.a, ...(item.alts || [])]
        .map(normalizeAnswer);

      return validAnswers.includes(normalizeAnswer(userAnswer));
    }

    function setActiveFilter(category) {

      });

      startQuiz();
    }

      bottomBar.style.display = "flex";

      renderQuestion();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function renderQuestion() {
      clearTimeout(autoNextTimer);

      answered = false;

      const item = quizQuestions[currentIndex];

      categoryBadge.textContent = item.c;
      taskEl.textContent = item.r;
      answersEl.innerHTML = "";

      progressText.textContent =
        `Вопрос ${currentIndex + 1} из ${quizQuestions.length}`;

      scoreText.textContent = `Верно: ${score}`;

      progressFill.style.width =
        `${(currentIndex / quizQuestions.length) * 100}%`;

      feedbackEl.className = "feedback";
      feedbackEl.innerHTML = "";

      nextBtn.style.display = "none";
      nextBtn.disabled = false;

      if (item.line) {
        scenarioCard.style.display = "block";
        speakerEl.textContent = item.speaker || "Собеседник";
        serbianLineEl.textContent = item.line;
        taskLabel.textContent = "Твоя реакция";
      } else {
        scenarioCard.style.display = "none";
        taskLabel.textContent = "Что сказать по-сербски";
      }

      if (item.t === "input") {
        renderInputQuestion();
      } else {
        renderChoiceQuestion(item);
      }
    }

    function renderChoiceQuestion(item) {
      const sameCategory = BANK.filter(question =>
        question.c === item.c &&
        question.a !== item.a
      );

      const wrongAnswers = shuffle(sameCategory)
        .slice(0, 3)
        .map(question => question.a);

      const options = shuffle([item.a, ...wrongAnswers]);

      options.forEach(option => {
        const button = document.createElement("button");

        button.className = "answer-btn";
        button.textContent = option;

        button.addEventListener("click", () => {
          checkChoiceAnswer(option, button);
        });

        answersEl.appendChild(button);
      });
    }

    function renderInputQuestion() {
      const inputArea = document.createElement("div");
      inputArea.className = "input-area";

      const input = document.createElement("input");
      input.type = "text";
      input.className = "text-answer";
      input.placeholder = "Напиши ответ по-сербски...";
      input.autocomplete = "off";
      input.autocapitalize = "sentences";
      input.spellcheck = false;

      const checkButton = document.createElement("button");
      checkButton.className = "main-btn";
      checkButton.textContent = "Проверить";

      checkButton.addEventListener("click", () => {
        checkInputAnswer(input);
      });

      input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          checkInputAnswer(input);
        }
      });

      inputArea.appendChild(input);
      inputArea.appendChild(checkButton);
      answersEl.appendChild(inputArea);
    }

    function checkChoiceAnswer(selected, selectedButton) {
      if (answered) return;

      answered = true;

      const item = quizQuestions[currentIndex];
      const isCorrect = selected === item.a;
      const allButtons = document.querySelectorAll(".answer-btn");

      allButtons.forEach(button => {
        button.disabled = true;

        if (button.textContent === item.a) {
          button.classList.add("correct");
        }
      });

      if (!isCorrect) {
        selectedButton.classList.add("wrong");
      }

      finishAnswer(isCorrect, item);
    }

    function checkInputAnswer(input) {
      if (answered) return;

      const userAnswer = input.value.trim();

      if (!userAnswer) {
        input.focus();
        input.placeholder = "Сначала введи ответ";
        return;
      }

      answered = true;

      const item = quizQuestions[currentIndex];
      const isCorrect = isCorrectAnswer(userAnswer, item);

      input.disabled = true;

      const checkButton = document.querySelector(".input-area .main-btn");

      if (checkButton) {
        checkButton.disabled = true;
      }

      input.classList.add(
        isCorrect ? "correct-input" : "wrong-input"
      );

      finishAnswer(isCorrect, item);
    }

    function finishAnswer(isCorrect, item) {
      if (isCorrect) {
        score++;

        feedbackEl.className = "feedback show good";
        feedbackEl.innerHTML = `
          <strong>Верно!</strong>
          <span class="hint">Такой короткий ответ звучит естественно.</span>
        `;

        scoreText.textContent = `Верно: ${score}`;

        nextBtn.style.display = "block";
        nextBtn.disabled = true;
        nextBtn.textContent = "Верно ✓";

        autoNextTimer = setTimeout(() => {
          nextQuestion();
        }, 900);
      } else {
        mistakes.push(item);

        feedbackEl.className = "feedback show bad";
        feedbackEl.innerHTML = `
          <strong>Почти.</strong>
          Правильный вариант: <b>${item.a}</b>
        `;

        nextBtn.style.display = "block";
        nextBtn.disabled = false;
        nextBtn.textContent =
          currentIndex === quizQuestions.length - 1
            ? "Показать результат"
            : "Следующий вопрос →";
      }
    }

    function nextQuestion() {
      clearTimeout(autoNextTimer);

      currentIndex++;

      if (currentIndex < quizQuestions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      clearTimeout(autoNextTimer);

      quizScreen.style.display = "none";
      resultScreen.style.display = "block";
      bottomBar.style.display = "none";

      progressFill.style.width = "100%";

      const total = quizQuestions.length;
      const percent = Math.round((score / total) * 100);

      finalScore.textContent = `${score} / ${total}`;

      if (percent === 100) {
        resultMessage.textContent =
          "Отлично! Ты уверенно реагируешь на реальные бытовые ситуации.";
      } else if (percent >= 75) {
        resultMessage.textContent =
          "Очень хороший результат. Пройди ещё один раунд — выпадут другие ситуации.";
      } else if (percent >= 50) {
        resultMessage.textContent =
          "Неплохо. Повтори ошибки ниже и запусти новый набор из 20 карточек.";
      } else {
        resultMessage.textContent =
          "Это нормальное начало. Повторяй короткие ответы — они быстро запоминаются.";
      }

      mistakesList.innerHTML = "";

      if (mistakes.length > 0) {
        mistakesBlock.style.display = "block";

        mistakes.forEach(item => {
          const div = document.createElement("div");
          div.className = "mistake-item";

          div.innerHTML = `
            <div><b>${item.r}</b></div>
            <span class="mistake-answer">${item.a}</span>
          `;

          mistakesList.appendChild(div);
        });
      } else {
        mistakesBlock.style.display = "none";
      }

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    document.querySelectorAll(".filter-btn").forEach(button => {
      button.addEventListener("click", () => {
        setActiveFilter(button.dataset.category);
      });
    });

    document.getElementById("restartBtn").addEventListener("click", startQuiz);
    document.getElementById("restartResultBtn").addEventListener("click", startQuiz);
    nextBtn.addEventListener("click", nextQuestion);

    startQuiz();
  </script>
</body>
</html>
